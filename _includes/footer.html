<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-md-6 text-center social-media-icons" style="margin: 0 auto;">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="ms-3 fs-2" target="_blank"><i class="fab fa-{{ item.icon }}"></i></a>
      {% endfor %}
    </div>
  </div>
</footer>
