---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h4 class="fw-bold">Research</h4>
    {{ content }}
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/assets/img/pradhanojas-home.jpg" alt="Home" width="100%">
  </div>
</div>

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h4 class="fw-bold border-bottom pb-3 mb-0">Updates</h4>
    <br>
    {% for post in site.posts %}
      <p><a href="{{ site.github.url }}/{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %-d, %Y" }}</p>
    {% endfor %}
  </div>
</div>
